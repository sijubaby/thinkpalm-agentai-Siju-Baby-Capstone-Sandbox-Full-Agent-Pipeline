[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-qa-agent"
version = "0.1.0"
description = "Agentic QA assistant for ThinkPalm maritime software testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30.0,<1.55",
    "httpx>=0.23.0,<0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.42.0",
]

[project.scripts]
qa-agent = "maritime_qa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maritime_qa.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
